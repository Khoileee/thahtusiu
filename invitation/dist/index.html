<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f2142">
  <title>Dear bạn Tú iu ♡</title>
  <meta name="description" content="Thứ Bảy 17/10 · cafe, một bộ phim và món mình thích. Bạn chọn nhé!">
  <meta property="og:title" content="Dear bạn Tú iu ♡">
  <meta property="og:description" content="Thứ Bảy 17/10 · cafe, phim và món mình thích. Bạn chọn nhé!">
  <meta property="og:image" content="assets/hero.webp">
  <link rel="icon" href="assets/star.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="screen cover" id="cover" aria-label="Thư mời">
    <button class="music-btn on-cover" data-action="music" aria-pressed="false" aria-label="Bật nhạc nền"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="music-label">Nhạc</span></button>
    <img class="cover-art" src="assets/hero.webp" alt="" width="1536" height="1024" fetchpriority="high">
    <div class="cover-inner">
      <p class="cover-date"><span>Thứ Bảy</span><b>17.10</b><span>Hà Đông</span></p>
      <article class="letter">
        <span class="stamp" aria-hidden="true">♡</span>
        <p class="dear">Dear bạn Tú iu,</p>
        <p>Thứ Bảy này bạn rảnh chứ ạ? Tui muốn rủ bạn đi chill chill một buổi cuối tuần: ngồi cafe ☕, xem một bộ phim 🎬, rồi ăn món mình thích 🍜</p>
        <p>Tui có lượn lờ một vòng toptop để lọc ra các địa điểm rồi. Bạn lướt qua rùi chọn nhé ạ ✨</p>
        <p class="sign">*Nóng lòng gặp bạn ♡</p>
        <button class="cta" data-action="open">Mở thiệp <span aria-hidden="true">→</span></button>
      </article>
    </div>
  </section>

  <section class="screen planner" id="planner" aria-label="Chọn kèo" hidden>
    <header class="topbar">
      <button class="home" data-action="cover" aria-label="Xem lại thư mời">♡</button>
      <nav class="tabs" id="tabs" aria-label="Các bước"></nav>
      <button class="music-btn" data-action="music" aria-pressed="false" aria-label="Bật nhạc nền"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="music-label">Nhạc</span></button>
    </header>
    <div class="scroller" id="scroller">
      <div class="body">
        <main class="stage" id="stage"></main>
        <aside class="ticket" id="ticket" aria-label="Kèo đang chọn"></aside>
      </div>
    </div>
    <footer class="pager" id="pager"></footer>
  </section>

  <dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Thiệp cần bật JavaScript để chọn quán nhé.</p></noscript>
  <script type="module" src="app.mjs"></script>
</body>
</html>
